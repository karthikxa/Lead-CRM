name: zed

services:
  scrapling-sidecar:
    build: ./scrapling-sidecar
    ports:
      - "8001:8000"
    environment:
      SCRAPLING_MAX_CONCURRENCY: 5
      SCRAPLING_SERVICE_TOKEN: local-dev-token
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  gmaps-scraper:
    image: gosom/google-maps-scraper:latest
    ports:
      - "8080:8080"
    volumes:
      - gmaps-data:/gmapsdata
      - gmaps-playwright-cache:/opt
    command: ["-data-folder", "/gmapsdata", "-addr", ":8080"]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 2s
      retries: 2

  server:
    image: twentycrm/twenty:${TAG:-latest}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
      - ./branding/patch-branding.sh:/app/patch-branding.sh:ro
      - ./lead_scraper_service.js:/app/packages/twenty-server/dist/lead_scraper_service.js
      - ./lead_finder_ui.js:/app/packages/twenty-server/dist/front/lead_finder_ui.js
      - ./lead_scraper_providers:/app/packages/twenty-server/dist/lead_scraper_providers:ro
    ports:
      - "${PORT:-3000}:3000"
    entrypoint: ["/bin/sh", "-c", "sh /app/patch-branding.sh; exec /app/entrypoint.sh node dist/main"]
    environment:
      NODE_PORT: 3000
      SCRAPLING_URL: http://scrapling-sidecar:8000
      SCRAPLING_SERVICE_TOKEN: local-dev-token
      GOSOM_URL: http://gmaps-scraper:8080
      GOSOM_ENABLED: "true"
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY}
      APP_SECRET: ${APP_SECRET:-}
      # Google OAuth - Gmail + SSO
      AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-true}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET}
      AUTH_GOOGLE_CALLBACK_URL: ${AUTH_GOOGLE_CALLBACK_URL}
      AUTH_GOOGLE_APIS_CALLBACK_URL: ${AUTH_GOOGLE_APIS_CALLBACK_URL}
      MESSAGING_PROVIDER_GMAIL_ENABLED: ${MESSAGING_PROVIDER_GMAIL_ENABLED:-true}
      CALENDAR_PROVIDER_GOOGLE_ENABLED: ${CALENDAR_PROVIDER_GOOGLE_ENABLED:-false}
      # Single Workspace Architecture (You are Admin, others join as Members)
      IS_MULTI_WORKSPACE_ENABLED: "false"
      IS_SIGNUP_DISABLED: ${IS_SIGNUP_DISABLED:-false}
      # Email sending
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Zed}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
      # FreeLLMAPI AI Gateway
      OPENAI_API_URL: ${OPENAI_API_URL:-https://server-llm-1.onrender.com/v1}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://server-llm-1.onrender.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-freellmapi-b8b35f76a87a2e3db4985258c26197a2f22ceabe528eb6ac}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL:-https://server-llm-1.onrender.com/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-freellmapi-b8b35f76a87a2e3db4985258c26197a2f22ceabe528eb6ac}
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-https://server-llm-1.onrender.com/v1}
      LLM_GATEWAY_DEFAULT_MODEL: ${LLM_GATEWAY_DEFAULT_MODEL:-auto}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  agency-worker:
    image: twentycrm/twenty:${TAG:-latest}
    entrypoint: ["node"]
    working_dir: /app
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
      - ./scripts:/app/scripts:ro
    command: ["/app/scripts/agency-workflow-worker.js"]
    environment:
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
      AGENCY_POLL_MS: "3000"
      SERVER_URL: ${SERVER_URL}
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: always

  worker:
    image: twentycrm/twenty:${TAG:-latest}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY}
      APP_SECRET: ${APP_SECRET:-}
      AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-true}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET}
      AUTH_GOOGLE_CALLBACK_URL: ${AUTH_GOOGLE_CALLBACK_URL}
      AUTH_GOOGLE_APIS_CALLBACK_URL: ${AUTH_GOOGLE_APIS_CALLBACK_URL}
      MESSAGING_PROVIDER_GMAIL_ENABLED: ${MESSAGING_PROVIDER_GMAIL_ENABLED:-true}
      CALENDAR_PROVIDER_GOOGLE_ENABLED: ${CALENDAR_PROVIDER_GOOGLE_ENABLED:-false}
      IS_MULTI_WORKSPACE_ENABLED: "false"
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Zed}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
      # FreeLLMAPI AI Gateway
      OPENAI_API_URL: ${OPENAI_API_URL:-https://server-llm-1.onrender.com/v1}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://server-llm-1.onrender.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-freellmapi-b8b35f76a87a2e3db4985258c26197a2f22ceabe528eb6ac}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL:-https://server-llm-1.onrender.com/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-freellmapi-b8b35f76a87a2e3db4985258c26197a2f22ceabe528eb6ac}
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-https://server-llm-1.onrender.com/v1}
      LLM_GATEWAY_DEFAULT_MODEL: ${LLM_GATEWAY_DEFAULT_MODEL:-auto}
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-postgres}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis
    restart: always
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  server-local-data:
  gmaps-data:
  gmaps-playwright-cache:
